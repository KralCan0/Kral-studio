<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#030a1e">
<title>Paraler Penguen</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.7/dist/umd/supabase.js"></script>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030a1e;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
canvas{display:block;width:100vw;height:100vh;touch-action:none;image-rendering:auto}
#modal{position:fixed;inset:0;display:none;align-items:flex-start;justify-content:center;padding-top:14vh;box-sizing:border-box;background:rgba(2,8,24,.78);z-index:10;font-family:"Trebuchet MS",Arial,sans-serif}
#modal .box{width:min(86vw,380px);background:#0a2350;border:2px solid #56d9ff;border-radius:20px;padding:20px;box-shadow:0 12px 40px rgba(0,0,0,.5)}
#mt{color:#fff;font-weight:800;font-size:19px;margin-bottom:14px;text-align:center}
#mi{width:100%;box-sizing:border-box;font-size:17px;padding:13px 14px;border-radius:12px;border:2px solid rgba(150,225,255,.5);background:#061b3c;color:#fff;outline:none}
#mi,#mi2{-webkit-user-select:text;user-select:text}
#mi:focus,#mi2:focus{border-color:#ffe07a}
#mi2{width:100%;box-sizing:border-box;font-size:17px;padding:13px 14px;border-radius:12px;border:2px solid rgba(150,225,255,.5);background:#061b3c;color:#fff;outline:none;margin-top:10px;display:none;font-family:inherit}
#modal button.danger{border-color:#ff5c7a;background:linear-gradient(#ff8aa0,#ff3d5f);color:#2a0008}
#modal .row{display:flex;gap:10px;margin-top:14px}
#modal button{flex:1;font-size:16px;font-weight:800;padding:13px 0;border-radius:999px;border:2px solid #56d9ff;background:transparent;color:#fff;font-family:inherit}
#modal button#mo{background:linear-gradient(#ffe07a,#ffa11f);border-color:#ffe07a;color:#1b2a4a}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="modal"><div class="box">
 <div id="mt"></div>
 <input id="mi" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" maxlength="48">
 <input id="mi2" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" maxlength="64">
 <div class="row"><button id="mc" type="button">İptal</button><button id="mo" type="button">Tamam</button></div>
</div></div>

<script>
const c=document.getElementById("game"),x=c.getContext("2d");
let W,H,dpr,ground;
let username="",role="user",vip=false,vipForever=false,profileUid=null,isGuest=false,guestName="";
function vipActive(){return role==="owner"||vip||vipForever;}
let dimMode="none";
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
const CLOUD_KEYS=new Set(["paralerCoins","paralerOwned","paralerSkin","paralerAvatar","paralerAch","paralerBg","paralerSfx","paralerMusic","paralerQ","penguinBest"]);
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){} if(CLOUD_KEYS.has(k))markDirty();}
const SUPA_URL="https://fjrcvdlxjakhpaekvvik.supabase.co";
const SUPA_KEY="sb_publishable_FKK1Vht2pPLDTa7BqpUsBQ_qngO85WA";
let sb=null;
try{ if(window.supabase) sb=window.supabase.createClient(SUPA_URL,SUPA_KEY,{auth:{persistSession:true,autoRefreshToken:true}}); }catch(e){ sb=null; }
let quality=lsGet("paralerQ"); if(!["low","mid","high"].includes(quality))quality="mid";
let fpsMode=lsGet("paralerFps")==="60"?60:30;
function qParams(){
 const d=devicePixelRatio||1;
 if(quality==="low")return {res:.42,snow:22,stars:25,aurora:1,smooth:false,pixel:true,filter:"none",glow:false};
 if(quality==="high")return {res:Math.min(d*1.25,3),snow:140,stars:120,aurora:5,smooth:true,pixel:false,filter:"saturate(1.3) contrast(1.06) brightness(1.04)",glow:true};
 return {res:Math.min(d,2),snow:70,stars:70,aurora:3,smooth:true,pixel:false,filter:"none",glow:false};
}
let Q=qParams();
let onResize=null;
if(typeof CanvasRenderingContext2D!=="undefined"&&!CanvasRenderingContext2D.prototype.roundRect){
 CanvasRenderingContext2D.prototype.roundRect=function(px,py,w,h,r){
  r=Array.isArray(r)?r[0]:(r||0);r=Math.max(0,Math.min(r,Math.abs(w)/2,Math.abs(h)/2));
  this.moveTo(px+r,py);this.arcTo(px+w,py,px+w,py+h,r);this.arcTo(px+w,py+h,px,py+h,r);
  this.arcTo(px,py+h,px,py,r);this.arcTo(px,py,px+w,py,r);this.closePath();
 };
}
addEventListener("contextmenu",e=>{if(!(e.target&&e.target.id==="mi"))e.preventDefault();});
function size(){
 const oldGround=ground;
 W=innerWidth;H=innerHeight;dpr=Q.res;
 c.width=Math.max(1,Math.round(W*dpr));c.height=Math.max(1,Math.round(H*dpr));
 c.style.width=W+"px";c.style.height=H+"px";
 c.style.imageRendering=Q.pixel?"pixelated":"auto";c.style.filter=Q.filter;
 x.setTransform(dpr,0,0,dpr,0,0);x.imageSmoothingEnabled=Q.smooth;ground=dimMode==="mirror"?(H/2)*.79:H*.79;
 if(onResize)onResize(oldGround);
}
function applyQuality(){Q=qParams();size();}
addEventListener("resize",size);size();

const modal=document.getElementById("modal"),mi=document.getElementById("mi"),mi2=document.getElementById("mi2");
const moBtn=document.getElementById("mo"),mcBtn=document.getElementById("mc");
let modalCb=null,modalPair=false;
function modalOpen(){return modal.style.display==="flex";}
function askText(title,cb,opts){
 opts=opts||{};
 document.getElementById("mt").textContent=title;
 mi.value="";mi.type=opts.password?"password":"text";mi.placeholder=opts.ph1||"";
 mi2.style.display="none";modalPair=false;
 modalCb=cb;modal.style.display="flex";
 moBtn.className=opts.danger?"danger":"";moBtn.textContent=opts.okLabel||"Tamam";
 setTimeout(()=>mi.focus(),60);
}
function askTextPair(title,ph1,ph2,cb,opts){
 opts=opts||{};
 document.getElementById("mt").textContent=title;
 mi.value="";mi.type="text";mi.placeholder=ph1||"";
 mi2.value="";mi2.type=opts.password2===false?"text":"password";mi2.placeholder=ph2||"";
 mi2.style.display="block";modalPair=true;
 modalCb=cb;modal.style.display="flex";
 moBtn.className=opts.danger?"danger":"";moBtn.textContent=opts.okLabel||"Tamam";
 setTimeout(()=>mi.focus(),60);
}
function closeModal(ok){
 const v=mi.value, v2=mi2.value, pair=modalPair, cb=modalCb;
 modalCb=null;modal.style.display="none";mi.blur();mi2.blur();
 if(ok&&cb){ if(pair)cb(v,v2); else cb(v); }
 setTimeout(size,300);
}
document.getElementById("mo").addEventListener("click",()=>closeModal(true));
document.getElementById("mc").addEventListener("click",()=>closeModal(false));
function modalEnter(e){
 if(e.key==="Enter"){e.preventDefault();closeModal(true);}
 else if(e.key==="Escape")closeModal(false);
 e.stopPropagation();
}
mi.addEventListener("keydown",modalEnter);
mi2.addEventListener("keydown",modalEnter);

function h53(str,seed=0){let h1=0xdeadbeef^seed,h2=0x41c6ce57^seed;for(let i=0,ch;i<str.length;i++){ch=str.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677);}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return 4294967296*(2097151&h2)+(h1>>>0);}

function menuLayout(){
 const land=W>H*1.15, L={land};
 L.tx=land?W*.27:W/2;          // title + penguin column
 L.bx=land?W*.73:W/2;          // button column
 L.fs=land?Math.min(W*.07,H*.15):Math.min(W*.15,H*.072);
 L.titleY=land?H*.2:H*.145;
 L.ground=land?H*.84:H*.585;
 L.ph=land?Math.min(H*.3,W*.2):Math.min(H*.2,W*.36);
 L.pw=L.ph*64/73;
 const bw=Math.min(land?W*.4:W*.74,380), bh=Math.max(40,Math.min(H*.085,66));
 const tiles=[{id:"shop",icon:"🛍️",label:"Dükkan"},{id:"quest",icon:"🎯",label:"Görev"}];
 if(dailyActive())tiles.push({id:"daily",icon:"🎁",label:"Ödül"});
 tiles.push({id:"profile",icon:"AVATAR",label:"Profil"});
 tiles.push({id:"leaderboard",icon:"🏆",label:"Skorlar"});
 if(role==="owner"){tiles.push({id:"panel",icon:"🛠️",label:"Panel"});tiles.push({id:"cheats",icon:"♾️",label:"Hileler"});}
 const n=tiles.length, gap=Math.min(W*.035,14), avail=land?W*.46:W*.92;
const tsz=Math.max(44,Math.min(W*(land?.1:.21),H*(land?.17:.095),84,(avail-gap*(n-1))/n));
 const rowW=tsz*n+gap*(n-1), sy=land?H*.3:H*.665, ry=land?H*.58:H*.79;
 L.start={id:"start",x:L.bx-bw/2,y:sy,w:bw,h:bh};
 L.tiles=tiles.map((tl,i)=>({...tl,x:L.bx-rowW/2+i*(tsz+gap),y:ry,w:tsz,h:tsz}));
 L.gear ={id:"gear", x:W-16-44,y:16,w:44,h:44,icon:"⚙️"};
 L.coin ={x:16,y:16,w:112,h:44};
 L.list=[L.start,...L.tiles,L.gear];
 return L;
}
function menuHit(px,py){
 const L=menuLayout(),s=6;
 for(const b of L.list){ if(px>=b.x-s&&px<=b.x+b.w+s&&py>=b.y-s&&py<=b.y+b.h+s) return b; }
 return null;
}

addEventListener("wheel",e=>{if(inPanel())shopScroll=Math.max(0,Math.min(shopMax,shopScroll+e.deltaY));},{passive:true});
function releasePointer(e){
 const r=c.getBoundingClientRect(), px=e.clientX-r.left, py=e.clientY-r.top;
 if(inPanel()&&drag){
  const d=drag;drag=null;
  if(!d.moved&&e.type==="pointerup")shopAction(shopHit(px,py));
  return;
 }
 if(screen==="auth"){
  const h=authHit(px,py), id=pressedId; pressedId=null;
  if(h&&h.id===id&&e.type==="pointerup")authAction(id);
  return;
 }
 if(screen!=="menu"||!pressedId)return;
 const h=menuHit(px,py), id=pressedId; pressedId=null;

}
c.addEventListener("pointerup",releasePointer);
c.addEventListener("pointercancel",releasePointer);

function rr(px,py,w,h,r){x.beginPath();x.roundRect(px,py,w,h,r);}
function rgba(col,a){return `rgba(${col[0]},${col[1]},${col[2]},${a})`;}

function drawSky(now,L){
 const g=x.createLinearGradient(0,0,0,L.ground);
 g.addColorStop(0,"#030a1e");g.addColorStop(.55,"#0a2250");g.addColorStop(1,"#1b5c92");
 x.fillStyle=g;x.fillRect(0,0,W,H);
 for(let si=0;si<Q.stars;si++){
  const s=stars[si];
  x.globalAlpha=.35+.65*(.5+.5*Math.sin(now/700+s.ph));
  x.fillStyle="#fff";x.beginPath();x.arc(s.x*W,s.y*H,s.r,0,Math.PI*2);x.fill();
 }
 x.globalAlpha=1;
}

function drawAurora(now){
 const cols=[[62,230,196],[122,107,255],[90,200,255]];
 for(let k=0;k<Q.aurora;k++){
  const col=cols[k%3], base=H*(.08+k*(Q.aurora>3?.042:.055)), amp=H*.035, hh=H*.24;
  const top=i=>base+Math.sin(i*.007+now/2300+k*1.7)*amp+Math.sin(i*.019-now/1500+k)*amp*.4;
  const g=x.createLinearGradient(0,base-amp*1.4,0,base+amp*1.4+hh);
  g.addColorStop(0,rgba(col,0));g.addColorStop(.45,rgba(col,.30));g.addColorStop(1,rgba(col,0));
  x.fillStyle=g;x.beginPath();x.moveTo(0,top(0));
  for(let i=14;i<=W+14;i+=14)x.lineTo(i,top(i));
  for(let i=W+14;i>=0;i-=14)x.lineTo(i,top(i)+hh);
  x.closePath();x.fill();
 }
}

function ridge(off,amp,base,color,f1,f2){
 x.fillStyle=color;x.beginPath();x.moveTo(0,H);
 for(let i=0;i<=W+16;i+=16){
  const u=i+off;
  x.lineTo(i,base-amp*(1-Math.abs(Math.sin(u*f1)))-amp*.3*Math.sin(u*f2+1.3));
 }
 x.lineTo(W+16,H);x.closePath();x.fill();
}

function drawIce(now,L){
 const g=x.createLinearGradient(0,L.ground,0,H);
 g.addColorStop(0,"#a8e4f6");g.addColorStop(.06,"#4d9fc8");g.addColorStop(.35,"#1f5f94");g.addColorStop(1,"#0a2448");
 x.fillStyle=g;x.fillRect(0,L.ground,W,H-L.ground);
 x.fillStyle="#e8fbff";x.fillRect(0,L.ground,W,3);
 // parallel speed lanes, each layer slides at its own pace
 const band=H-L.ground;
 for(let j=0;j<4;j++){
  const y=L.ground+band*(.1+j*.12+j*j*.02), per=130+j*70, off=(now*(.22+.2*j))%per;
  x.fillStyle=`rgba(220,246,255,${.34-j*.06})`;
  for(let xx=-off-per;xx<W;xx+=per)x.fillRect(xx,y,per*.42,2+j);
 }
}

function drawGlints(now,L){
 const band=H-L.ground;
 for(let i=0;i<18;i++){
  const px=((i*97.3+now*.012*(1+i%3))%W), py=L.ground+band*(.06+((i*53)%80)/100);
  const a=.5+.5*Math.sin(now/260+i*1.7), r=1.5+3*a;
  x.save();x.globalAlpha=a*.85;x.fillStyle="#fff";x.beginPath();
  x.moveTo(px,py-r);x.lineTo(px+r*.3,py-r*.3);x.lineTo(px+r,py);x.lineTo(px+r*.3,py+r*.3);
  x.lineTo(px,py+r);x.lineTo(px-r*.3,py+r*.3);x.lineTo(px-r,py);x.lineTo(px-r*.3,py-r*.3);x.closePath();x.fill();x.restore();
 }
}
function drawHero(now,L){
 if(Q.glow){
  const g=x.createRadialGradient(L.tx,L.ground-L.ph*.5,0,L.tx,L.ground-L.ph*.5,L.ph*1.1);
  g.addColorStop(0,"rgba(120,220,255,.28)");g.addColorStop(1,"rgba(120,220,255,0)");
  x.fillStyle=g;x.fillRect(L.tx-L.ph*1.2,L.ground-L.ph*1.7,L.ph*2.4,L.ph*2.4);
 }
 const n=penguinFrames.length||1, idx=Math.floor(now/110), fr=penguinFrames[idx%n];
 const k=L.ph/73, ph=idx%4, bob=[0,-1.5,.8,-1][ph]*k;
 // shadow
 x.fillStyle="rgba(4,22,56,.38)";x.beginPath();
 x.ellipse(L.tx,L.ground+5,L.pw*.38,L.pw*.07,0,0,Math.PI*2);x.fill();
 // snow kicked up behind the feet
 for(let i=0;i<7;i++){
  const a=((now/520)+i/7)%1;
  x.fillStyle=`rgba(235,250,255,${(1-a)*.6})`;x.beginPath();

 }

  drawCostume(equipped,sk,L.tx,L.ground+2,sh,now,false,0,1+.07*rk,true);

   x.lineWidth=5;x.lineJoin="round";x.strokeStyle="#041634";x.fillStyle=sp.bcol;
   const ty=L.ground-sh-8-rk*10;
   x.strokeText(sp.bubble,L.tx+sw*.2,ty);x.fillText(sp.bubble,L.tx+sw*.2,ty);
   x.restore();
  }
 }else if(sk){
  const sh=L.ph*1.02, sw=sh*sk.naturalWidth/sk.naturalHeight;
  x.drawImage(sk,L.tx-sw/2,L.ground-sh+bob*1.8,sw,sh);
 }else if(fr&&fr.complete&&fr.naturalWidth)x.drawImage(fr,L.tx-L.pw/2,L.ground-L.ph+bob,L.pw,L.ph);

function shopLayout(){
 const S={pad:Math.max(14,Math.min(W*.04,28))};
 S.back={id:"back",x:S.pad,y:16,w:44,h:44};
 S.coin={x:W-S.pad-112,y:16,w:112,h:44};
 const tw=Math.min((W-S.pad*2-10)/2,260), tx0=W/2-(tw*2+10)/2;
 S.t1={id:"tab_skins",x:tx0,y:76,w:tw,h:46,label:"👕 Kıyafetler"};
 S.t2={id:"tab_packs",x:tx0+tw+10,y:76,w:tw,h:46,label:"🎁 Paketler"};
 S.top=136;
 return S;

function shopHit(px,py,headerOnly){
 const S=shopLayout();
 for(const h of shopHits){
  if(headerOnly&&h.content)continue;
  if(h.content&&py<(h.clipTop||S.top))continue;
  if(px>=h.x&&px<=h.x+h.w&&py>=h.y&&py<=h.y+h.h)return h.id;
 }
 return null;
}
function shopAction(id){
 if(!id)return;
 if(!id.startsWith("skin:")&&id!=="daily_claim")sfx(id==="back"?"back":"click");
 if(id==="back"){goMenu();return;}
 if(id.startsWith("q:")){quality=id.slice(2);lsSet("paralerQ",quality);applyQuality();return;}
 if(id.startsWith("fps:")){fpsMode=+id.slice(4)===60?60:30;lsSet("paralerFps",String(fpsMode));return;}
 if(id==="daily_claim"){claimDaily();return;}
 if(id==="credits"){openCredits();return;}
 if(id==="leaderboard"){openLeaderboard();return;}
 if(id==="panel"){openPanel();return;}
 if(id==="cheats"){openCheats();return;}
 if(id==="panel_search"){panelDoSearch();return;}
 if(id==="panel_back_list"){panelSel=null;return;}
 if(id.startsWith("panel_pick:")){panelPick(id.slice(11));return;}
 if(id==="panel_coins"){panelEditCoins();return;}
 if(id==="panel_best"){panelEditBest();return;}
 if(id==="panel_vip"){panelToggleVip();return;}
 if(id.startsWith("panel_role:")){panelSetRole(id.slice(11));return;}
 if(id==="cheat_invincible"){cheatInvincible=!cheatInvincible;return;}
 if(id==="cheat_speed_up"){cheatSpeedMult=Math.min(3,+(cheatSpeedMult+.25).toFixed(2));return;}
 if(id==="cheat_speed_down"){cheatSpeedMult=Math.max(.25,+(cheatSpeedMult-.25).toFixed(2));return;}
 if(id==="cheat_speed_reset"){cheatSpeedMult=1;return;}
 if(id==="danger_signout"){doSignOut();return;}
 if(id==="danger_delete"){doDeleteAccount();return;}
 if(id.startsWith("bg:")){
  const v=id.slice(3);
  if(v!=="auto"&&!vipActive()){sfx("deny");menuNotice("Bu arka plan VİP'e özel.");return;}
  if(v==="auto"||THEME_SCORE[v]!==undefined){bgTheme=v;lsSet("paralerBg",v);}
  return;
 }
 if(id.startsWith("av:")){const k=id.slice(3);if(avatarOk(k)){avatar=k;lsSet("paralerAvatar",k);sfx("equip");}return;}
 if(id.startsWith("sfx:")){sfxOn=id.endsWith("1");lsSet("paralerSfx",sfxOn?"1":"0");if(sfxOn)sfx("click");return;}
 if(id.startsWith("mus:")){musicOn=id.endsWith("1");lsSet("paralerMusic",musicOn?"1":"0");return;}
 if(id==="tab_skins"){shopTab="skins";shopScroll=0;return;}
 if(id==="tab_packs"){shopTab="packs";shopScroll=0;return;}
 if(id==="pack_vip"){sfx("deny");menuNotice("VİP şu anda alınamıyor.");return;}
 if(id==="pack_support"){
  if(creatorName){menuNotice("Destekçi kaydın etkin ve değiştirilemez.");return;}
  askText("İsmini yaz",v=>{
   const n=v.trim();
   if(okSupport(n)){
    creatorName=n;lsSet("paralerCreator",n);
    menuNotice("Destekçi olarak kaydedildin!");sfx("ach");
   }else{menuNotice("Geçersiz, kabul edilmedi.");sfx("deny");}
  });
  return;
 }
 if(id==="pack_code"){
  askText("Kodunu yaz",v=>{
   const hv=h53(v.trim().normalize("NFC")), c=CODES.find(z=>z[0]===hv);
   if(!c){menuNotice("Geçersiz kod.");sfx("deny");return;}
   const sp=spec(c[1]);
   if(owned.includes(sp.key)){menuNotice("Bu kodu zaten kullandın.");sfx("deny");return;}
   owned.push(sp.key);equipped=sp.key;saveShop();
   sfx("ach");setTimeout(()=>sfx(sp.snd),350);achCheck();
   reward={key:sp.key,t0:performance.now()};
  });
  return;
 }
 if(id.startsWith("skin:"))buySkin(id.slice(5));
}
function buySkin(key){
 if(key==="classic"){
  if(equipped==="classic")menuNotice("Klasik penguen zaten giyili.");
  else{equipped="classic";saveShop();menuNotice("Klasik penguen giyildi.");sfx("equip");}
  return;
 }
 const s=isSpecial(key)?spec(key):SKINS.find(z=>z.key===key); if(!s)return;
 if(s.vip&&!vipActive()){sfx("deny");menuNotice("Bu kostüm sadece VİP'lere özel.");return;}
 if(owned.includes(key)){
  if(equipped===key)menuNotice(s.name+" zaten giyili.");
  else{equipped=key;saveShop();menuNotice(s.name+" giyildi!");sfx("equip");}
  return;
 }
 if(coins<s.price){sfx("deny");menuNotice("Yetersiz Coin! "+(s.price-coins)+" Coin daha lazım.");return;}
 coins-=s.price;owned.push(key);equipped=key;saveShop();sfx("buy");achCheck();
 menuNotice(s.name+" alındı ve giyildi!");
}

function drawDino(im,bx,by,h,time,air,tilt,pulse){
 const w=h*im.naturalWidth/im.naturalHeight, ph=time/135, st=Math.sin(ph);
 let sx=1,sy=1,rot=0,lift=0;
 if(air){sy=1.06;sx=.96;rot=tilt;}
 else{sy=1+.045*st;sx=1-.035*st;rot=.06*Math.sin(ph);lift=-Math.abs(st)*h*.03;}
 x.save();x.translate(bx,by+lift);x.rotate(rot);x.scale(sx*(pulse||1),sy*(pulse||1));
 x.drawImage(im,-w/2,-h,w,h);x.restore();
}
function dinoFx(bx,by,w,h,time,running){
 x.save();
 if(running)for(let i=0;i<6;i++){
  const a=((time/480)+i/6)%1;
  x.fillStyle=`rgba(190,240,150,${(1-a)*.55})`;x.beginPath();
  x.arc(bx-w*.32-a*w*1.1,by-3-a*h*.22,(1-a)*h*.055+1,0,Math.PI*2);x.fill();
 }
 for(let i=0;i<5;i++){
  const ang=time/900+i*1.26, px=bx+Math.cos(ang)*w*.62, py=by-h*.55+Math.sin(ang*1.3+i)*h*.5;
  const a=.5+.5*Math.sin(time/260+i*2), r=2+4*a;
  x.globalAlpha=a;x.fillStyle=i%2?"#ffe07a":"#9bf5b8";
  x.beginPath();x.moveTo(px,py-r);x.lineTo(px+r*.3,py-r*.3);x.lineTo(px+r,py);x.lineTo(px+r*.3,py+r*.3);
  x.lineTo(px,py+r);x.lineTo(px-r*.3,py+r*.3);x.lineTo(px-r,py);x.lineTo(px-r*.3,py-r*.3);x.closePath();x.fill();
 }
 x.restore();
}

const QTYPES={
 score:    {icon:"⭐",tiers:[[60,10],[100,15],[150,25],[200,35]],text:t=>`Tek oyunda ${t} skora ulaş`},
 obstacles:{icon:"🧊",tiers:[[20,10],[40,20],[60,30],[100,45]],text:t=>`Bugün toplam ${t} engel geç`},
 games:    {icon:"🎮",tiers:[[3,8],[5,15],[8,25]],text:t=>`Bugün ${t} oyun oyna`},
 jumps:    {icon:"🦘",tiers:[[30,8],[60,15],[100,25]],text:t=>`Bugün ${t} kez zıpla`},
 fish:     {icon:"🐟",tiers:[[3,10],[6,18],[10,30]],text:t=>`Bugün ${t} balık topla`},
 run:      {icon:"🏃",tiers:[[10,10],[20,20],[30,30]],text:t=>`Ölmeden tek oyunda ${t} engel geç`}
};
let quests=null,qCheck=-1e9,runObs=0,gToast=null;

function rng32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function todayKey(){const d=new Date();return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();}
function genQuests(){
 const day=todayKey(), r=rng32(h53("paraler-quests-"+day)%4294967296);
 const types=Object.keys(QTYPES);
 for(let i=types.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[types[i],types[j]]=[types[j],types[i]];}
 const q=types.slice(0,3).map(type=>{
  const tiers=QTYPES[type].tiers, tr=tiers[Math.floor(r()*tiers.length)];
  return {type,target:tr[0],reward:tr[1],prog:0,done:false};
 });
 return {day,q};
}
function saveQuests(){lsSet("paralerQuests",JSON.stringify(quests));}
function loadQuests(){
 let q=null;try{q=JSON.parse(lsGet("paralerQuests")||"null");}catch(e){q=null;}
 if(!q||q.day!==todayKey()||!Array.isArray(q.q))q=genQuests();
 quests=q;saveQuests();
}
function ensureQuests(){
 const n=performance.now();
 if(quests&&n-qCheck<5000)return;
 qCheck=n;
 if(!quests||quests.day!==todayKey())loadQuests();
}
function gameToast(txt){gToast={txt,until:performance.now()+2800};}
function qProgress(type,val,mode){
 ensureQuests();
 let changed=false;
 for(const q of quests.q){
  if(q.type!==type||q.done)continue;
  const np=mode==="add"?q.prog+val:Math.max(q.prog,val);
  if(np===q.prog)continue;
  q.prog=np;changed=true;
  if(q.prog>=q.target){
   q.done=true;q.prog=q.target;
   coins+=q.reward;lsSet("paralerCoins",coins);
   gameToast("Görev tamamlandı! +"+q.reward+" Coin");
   menuNotice("Görev tamamlandı! +"+q.reward+" Coin");
   sfx("quest");achCheck();
  }
 }
 if(changed)saveQuests();
}
function openQuests(){ensureQuests();loadQuests();screen="quests";shopScroll=0;drag=null;pressedId=null;}
function openSettings(){screen="settings";shopScroll=0;drag=null;pressedId=null;}

let AC=null,master=null,sfxBus=null,musBus=null,delayN=null,musTimer=null,musStep=0,musNext=0,lastRoar=-1;
let sfxOn=lsGet("paralerSfx")!=="0", musicOn=lsGet("paralerMusic")!=="0";
const midi=m=>440*Math.pow(2,(m-69)/12);

function audioInit(){
 if(AC){if(AC.state==="suspended"&&AC.resume)AC.resume();return;}
 try{
  const A=window.AudioContext||window.webkitAudioContext; if(!A)return;
  AC=new A();
  const comp=AC.createDynamicsCompressor();comp.threshold.value=-16;comp.ratio.value=4;
  master=AC.createGain();master.gain.value=.85;master.connect(comp);comp.connect(AC.destination);
  sfxBus=AC.createGain();sfxBus.gain.value=.9;sfxBus.connect(master);
  musBus=AC.createGain();musBus.gain.value=.2;musBus.connect(master);
  delayN=AC.createDelay(.5);delayN.delayTime.value=.17;
  const fb=AC.createGain();fb.gain.value=.28;const dl=AC.createGain();dl.gain.value=.32;
  delayN.connect(fb);fb.connect(delayN);delayN.connect(dl);dl.connect(master);
  musNext=AC.currentTime+.15;
  musTimer=setInterval(musTick,100);
 }catch(e){AC=null;}
}
["pointerdown","pointerup","touchend","click","keydown"].forEach(ev=>addEventListener(ev,audioInit,{passive:true}));
document.addEventListener("visibilitychange",()=>{
 if(!AC)return;
 if(document.hidden){if(AC.suspend)AC.suspend();}else if(AC.resume)AC.resume();
});

function tone(freq,t0,dur,type,vol,o){
 o=o||{};
 const osc=AC.createOscillator(),g=AC.createGain();
 osc.type=type;osc.frequency.setValueAtTime(freq,t0);
 if(o.slideTo)osc.frequency.exponentialRampToValueAtTime(o.slideTo,t0+dur);
 g.gain.setValueAtTime(.0001,t0);
 g.gain.exponentialRampToValueAtTime(vol,t0+(o.attack||.006));
 g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
 osc.connect(g);g.connect(o.bus||sfxBus);
 if(o.echo&&delayN)g.connect(delayN);
 osc.start(t0);osc.stop(t0+dur+.05);
}
function noiseBurst(t0,dur,vol,freq,q,bus){
 const n=Math.max(1,Math.floor(AC.sampleRate*dur)),buf=AC.createBuffer(1,n,AC.sampleRate),d=buf.getChannelData(0);
 for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
 const s=AC.createBufferSource();s.buffer=buf;
 const f=AC.createBiquadFilter();f.type="bandpass";f.frequency.value=freq;f.Q.value=q;
 const g=AC.createGain();g.gain.value=vol;
 s.connect(f);f.connect(g);g.connect(bus||sfxBus);s.start(t0);
}
function sfx(name){
 if(!sfxOn||!AC)return;
 try{
 const t=AC.currentTime+.005;
 switch(name){
  case "jump":
   tone(300,t,.17,"triangle",.26,{slideTo:760});
   tone(620,t+.03,.12,"sine",.1,{slideTo:1180});
   break;
  case "tick": tone(1500,t,.045,"sine",.06); break;
  case "fish":
   tone(midi(88),t,.3,"triangle",.2,{echo:true});

   break;
  case "die":
   tone(430,t,.5,"sawtooth",.2,{slideTo:70});
   tone(95,t+.04,.45,"sine",.38,{slideTo:38});
   noiseBurst(t,.32,.4,320,.8);
   break;
  case "click": tone(740,t,.05,"triangle",.15); tone(1110,t+.02,.04,"sine",.07); break;
  case "back": tone(540,t,.08,"triangle",.14,{slideTo:380}); break;
  case "equip": tone(midi(76),t,.1,"triangle",.17); tone(midi(83),t+.08,.16,"triangle",.17); break;
  case "buy":
   [72,76,79,84].forEach((m,i)=>tone(midi(m),t+i*.075,.24,"triangle",.2,{echo:true}));
   noiseBurst(t+.3,.12,.1,7000,1);
   break;
  case "deny": tone(165,t,.12,"square",.1); tone(130,t+.13,.18,"square",.1); break;
  case "quest":
   [72,76,79,84,88].forEach((m,i)=>tone(midi(m),t+i*.085,.3,"triangle",.2,{echo:true}));
   tone(midi(84),t+.45,.7,"sine",.1,{echo:true});
   break;
  case "ach":
   [67,74,79,86].forEach((m,i)=>tone(midi(m),t+i*.1,.45,"sine",.2,{echo:true}));
   tone(midi(91),t+.4,.8,"triangle",.1,{echo:true});
   noiseBurst(t+.35,.25,.06,9000,2);
   break;
  case "daily":
   for(let i=0;i<7;i++)tone(midi(72+[0,4,7,12,16,19,24][i]),t+i*.06,.3,"triangle",.17,{echo:true});
   break;
  case "chime":
   tone(midi(88),t,.7,"sine",.1,{echo:true});tone(midi(95),t+.12,.8,"sine",.07,{echo:true});
   break;
  case "charm":
   [84,88,91,96,100].forEach((m,i)=>tone(midi(m),t+i*.07,.4,"sine",.17,{echo:true}));
   tone(midi(108),t+.4,.5,"triangle",.07,{echo:true});
   noiseBurst(t+.05,.3,.05,9500,2);
   break;
  case "meow":
   tone(650,t,.18,"sine",.2,{slideTo:980});
   tone(980,t+.18,.3,"triangle",.17,{slideTo:520});
   tone(1300,t+.05,.2,"sine",.05,{slideTo:1700});
   break;
  case "sus":
   tone(220,t,.11,"square",.1,{slideTo:330});
   tone(330,t+.11,.11,"square",.1,{slideTo:196});
   tone(147,t+.24,.22,"sawtooth",.09);
   break;
  case "pickup":
   [84,88,91,96].forEach((m,i)=>tone(midi(m),t+i*.045,.3,"triangle",.17,{echo:true}));
   break;
  case "shield":
   tone(220,t,.4,"sine",.2,{slideTo:660});tone(330,t+.05,.4,"triangle",.12,{slideTo:990});
   break;
  case "magnet":
   tone(300,t,.5,"sawtooth",.09,{slideTo:90});tone(900,t,.4,"sine",.08,{slideTo:300});
   break;
  case "speed":
   noiseBurst(t,.4,.2,1800,.8);tone(200,t,.4,"sawtooth",.09,{slideTo:1000});
   break;
  case "jumppow":
   tone(250,t,.3,"sine",.22,{slideTo:700});tone(500,t+.1,.3,"sine",.15,{slideTo:1200});
   break;
  case "smash":
   noiseBurst(t,.25,.4,900,.9);tone(180,t,.2,"square",.12,{slideTo:60});
   break;
  case "powerend":
   tone(660,t,.15,"triangle",.14);tone(440,t+.14,.25,"triangle",.14,{slideTo:330});
   break;
  case "portal":
   tone(160,t,.6,"sawtooth",.12,{slideTo:1100});
   [76,83,88,95].forEach((m,i)=>tone(midi(m),t+.1+i*.08,.5,"sine",.12,{echo:true}));
   noiseBurst(t,.5,.12,2500,1.2);
   break;
  case "dimexit":
   tone(900,t,.5,"sawtooth",.1,{slideTo:200});
   [95,88,83,76].forEach((m,i)=>tone(midi(m),t+i*.08,.45,"sine",.12,{echo:true}));
   noiseBurst(t,.4,.1,1800,1);
   break;
  case "roar":{
   const o=AC.createOscillator(),f=AC.createBiquadFilter(),g=AC.createGain();
   o.type="sawtooth";o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(55,t+.75);
   f.type="lowpass";f.frequency.setValueAtTime(1100,t);f.frequency.exponentialRampToValueAtTime(240,t+.75);
   g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.34,t+.08);g.gain.exponentialRampToValueAtTime(.0001,t+.8);
   o.connect(f);f.connect(g);g.connect(sfxBus);o.start(t);o.stop(t+.85);
   noiseBurst(t,.7,.22,420,.7);

 }

}

const CHORDS=[{root:45,pad:[57,60,64]},{root:41,pad:[53,57,60]},{root:48,pad:[55,60,64]},{root:43,pad:[55,59,62]}];
const PENTA=[0,2,4,7,9];
function musTick(){
 if(!AC)return;
 if(!musicOn||AC.state!=="running"){musNext=AC.currentTime+.1;return;}
 const sp=screen==="game"?.3:.38;
 while(musNext<AC.currentTime+.35){
  const n=musStep, ch=CHORDS[Math.floor(n/8)%4], night=screen==="game"&&todPhase()===4;
  if(n%8===0)ch.pad.forEach(m=>tone(midi(m),musNext,sp*8*.95,"triangle",.045,{bus:musBus,attack:.5}));
  if(n%4===0)tone(midi(ch.root),musNext,sp*3.4,"sine",.085,{bus:musBus});
  const pr=n%2===0?.72:.3;
  if(Math.random()<pr){
   const m=(night?60:72)+PENTA[Math.floor(Math.random()*5)]+(Math.random()<.3?12:0);
   tone(midi(m),musNext,sp*1.8,"triangle",.06,{bus:musBus});
   tone(midi(m+12),musNext,sp*.9,"sine",.02,{bus:musBus});
  }
  if(screen==="game"&&n%2===1)noiseBurst(musNext,.03,.03,8000,2,musBus);
  musStep++;musNext+=sp;
 }
}

 if(fallers.length<36&&Math.random()<(dimMode==="ice"?.22:.16)){
  fallers.push({x:Math.random()*W,y:-12,vy:3+Math.random()*3.2,s:dimMode==="ice"?5+Math.random()*8:4+Math.random()*6,rot:Math.random()*6,landY:ground-6-Math.random()*Math.min(26,ground*.08)});

/* ---------- SÜPER GÜÇLER: kalkan, mıknatıs, hız, zıplama ---------- */

const POWERS={

 speed: {name:"HIZ",     col:[255,210,63], min:3,max:4},
 jump:  {name:"ZIPLAMA", col:[85,224,138], min:3,max:4}
};
let powerups=[],pw=null,puTimer=700,lastPu="",shards=[],shieldGrace=0;

function resetPower(){
 powerups=[];pw=null;shards=[];shieldGrace=0;lastPu="";
 puTimer=600+Math.random()*300;          // oyun başladıktan ~10-15 sn sonra ilk güç
}
const speedOn=()=>!!pw&&pw.kind==="speed";
function fishChance(base){return pw&&pw.kind==="magnet"?.65:base;}
function jumpImpulse(){
 if(pw&&pw.kind==="jump"){
  const cap=Math.sqrt(2*.68*Math.max(60,ground-p.h-10));
  return -Math.max(11.7,Math.min(15.2,cap));
 }
 return -11.7;
}
function jumpBoost(){
 if(!(pw&&pw.kind==="jump"))return;
 sfx("jumppow");
 for(let i=0;i<9;i++)shards.push({x:p.x+p.w/2,y:ground-2,vx:(Math.random()-.5)*6,vy:-Math.random()*2.6,life:1,s:3,col:"#55e08a"});
}
function powerTick(){
 if(shieldGrace>0)shieldGrace--;
 if(!pw)return;
 pw.left--;
 if(pw.left<=0){
  if(pw.kind==="shield")shieldGrace=24;
  sfx("powerend");pw=null;
  puTimer=720+Math.random()*540;         // bir güç bittikten sonra 12-21 sn bekleme
 }
}
function puLogic(){
 if(pw||powerups.length)return;
 if(puTimer>0){puTimer--;return;}
 if(dimEnding||obs.some(o=>o.kind==="portal"))return;
 if(spawn<45)return;                       // sıradaki engele yeterince uzak
 for(const o of obs)if(o.x>W-150)return;   // az önce doğan engelin yanında değil
 for(const f of fish)if(f.x>W-120)return;
 spawnPowerup();
}
function spawnPowerup(){
 const kinds=Object.keys(POWERS).filter(k=>k!==lastPu);
 const kind=kinds[Math.floor(Math.random()*kinds.length)];
 lastPu=kind;
 powerups.push({kind,x:W+30,y:ground-66,w:36,h:36,ph:Math.random()*6});
}
function activatePower(kind){
 const P=POWERS[kind], sec=P.min+Math.random()*(P.max-P.min), total=Math.round(sec*60);
 pw={kind,total,left:total};
 sfx("pickup");sfx(kind==="jump"?"jumppow":kind);
 addPop(p.x+p.w/2,p.y-14,P.name+"!");
}
function updatePowerups(pr){
 for(const u of powerups){
  u.x-=speed;
  if(!u.got&&pr.x<u.x+u.w&&pr.x+pr.w>u.x&&pr.y<u.y+u.h&&pr.y+pr.h>u.y){u.got=true;activatePower(u.kind);}
 }
 const n=powerups.length;
 powerups=powerups.filter(u=>!u.got&&u.x+u.w>-20);
 if(powerups.length<n&&!pw)puTimer=660+Math.random()*420;      // kaçırıldı
}
function magnetPull(){
 if(!(pw&&pw.kind==="magnet"))return;
 const cx=p.x+p.w/2, cy=p.y+p.h/2, R=300;
 for(const f of fish){
  const dx=cx-(f.x+f.w/2), dy=cy-(f.y+f.h/2), d=Math.hypot(dx,dy);
  if(d<R&&d>1){const s=Math.min(d,7+(1-d/R)*13);f.x+=dx/d*s;f.y+=dy/d*s;}

 let s=u.trim().toLowerCase().replace(/[^a-z0-9_.-]/g,"");
 if(!s)s="u"+Date.now();
 return s+"@paraler.local";
}
function validUsername(u){
 u=u.trim();
 if(u.length<3||u.length>20)return "Kullanıcı adı 3-20 karakter olmalı.";
 if(!/^[A-Za-z0-9_ÇĞİÖŞÜçğıöşü]+$/.test(u))return "Kullanıcı adında yalnızca harf, rakam ve _ olabilir.";

function authErrText(e){

 if(/already registered|exists/i.test(m))return "Bu kullanıcı adı alınmış.";

function applyProfile(row,noDirty){
 const guard=noDirty!==false;
 profileUid=row.id;username=row.username;role=row.role||"user";
 vip=!!row.vip;vipForever=!!row.vip_forever;freeCostumeCredits=row.free_costume_credits||0;
 lastRoleBonus=row.last_role_bonus||"";
 coins=Number(row.coins)||0;best=Number(row.best_score)||0;
 try{owned=Array.isArray(row.owned)?row.owned:JSON.parse(row.owned||'["classic"]');}catch(e){owned=["classic"];}
 if(!owned.includes("classic"))owned.unshift("classic");
 equipped=row.equipped||"classic";if(equipped!=="classic"&&!owned.includes(equipped))equipped="classic";
 avatar=row.avatar||"classic";if(!avatarOk(avatar))avatar="classic";
 try{achGot=row.achievements&&Object.keys(row.achievements).length?row.achievements:{};}catch(e){achGot={};}
 for(const a of ACH)if(a.never)delete achGot[a.id];
 bgTheme=row.bg_theme||"auto";sfxOn=row.sfx!==false;musicOn=row.music!==false;
 quality=["low","mid","high"].includes(row.quality)?row.quality:"mid";applyQuality();
 if(guard){profileDirty=false;}
}
function localSnapshot(){
 return {coins,best_score:best,owned:JSON.stringify(owned),equipped,avatar,
  achievements:achGot||{},bg_theme:bgTheme,sfx:sfxOn,music:musicOn,quality};
}
function markDirty(){ if(profileUid&&!isGuest) profileDirty=true; }

 profileDirty=false;

 catch(e){ profileDirty=true; }
}

async function roleWelcomeCheck(){

  try{localStorage.setItem("paralerLastRole",role);}catch(e){}
  if(role==="creator"||role==="admin"){
   const need=role==="admin"?2:1;
   if(freeCostumeCredits<need){
    freeCostumeCredits=need;
    if(sb&&profileUid){try{await sb.from("profiles").update({free_costume_credits:need}).eq("id",profileUid);}catch(e){}}
   }
  }

  else if(role==="admin"){gameToast("🛡️ Admin oldun!");sfx("roleadmin");}
  else if(role==="owner"){gameToast("👑 Yönetici girişi");sfx("roleowner");}
 }
}
async function roleBonusCheck(){

async function afterLogin(uid){
 authBusy=true;
 try{
  const {data,error}=await sb.from("profiles").select("*").eq("id",uid).single();
  if(error||!data){authErr="Profil yüklenemedi.";authBusy=false;return false;}
  isGuest=false;applyProfile(data);
  await roleWelcomeCheck();await roleBonusCheck();
  screen="menu";authBusy=false;return true;
 }catch(e){authErr="Bağlantı hatası.";authBusy=false;return false;}
}

function doSignUp(){
 askTextPair("HESAP AÇ","Kullanıcı adı","Şifre (en az 6 karakter)",async(u,p)=>{
  const verr=validUsername(u);
  if(verr){menuNotice(verr);sfx("deny");return;}
  if(p.length<6){menuNotice("Şifre en az 6 karakter olmalı.");sfx("deny");return;}
  if(!sb){menuNotice("Sunucuya bağlanılamıyor.");sfx("deny");return;}
  authBusy=true;sfx("click");
  try{
   const email=emailFor(u);
   const {data,error}=await sb.auth.signUp({email,password:p});
   if(error){menuNotice(authErrText(error));authBusy=false;sfx("deny");return;}
   const uid=data&&data.user&&data.user.id;
   if(!uid){menuNotice("Hesap oluşturuldu! E-posta onayı gerekiyorsa onaylayıp tekrar gir.");authBusy=false;return;}
   const {error:perr}=await sb.from("profiles").insert({id:uid,username:u.trim()});
   if(perr){
    if(perr.code==="23505"){menuNotice("Bu kullanıcı adı alınmış.");}
    else menuNotice("Profil oluşturulamadı.");
    authBusy=false;sfx("deny");return;
   }
   sfx("ach");await afterLogin(uid);
  }catch(e){menuNotice("Bağlantı hatası.");authBusy=false;sfx("deny");}
 });
}
function doSignIn(){
 askTextPair("ZATEN HESABIM VAR","Kullanıcı adı","Şifre",async(u,p)=>{
  if(!u.trim()||!p){menuNotice("Kullanıcı adı ve şifre yaz.");sfx("deny");return;}
  if(!sb){menuNotice("Sunucuya bağlanılamıyor.");sfx("deny");return;}
  authBusy=true;sfx("click");
  try{
   const email=emailFor(u);
   const {data,error}=await sb.auth.signInWithPassword({email,password:p});
   if(error){menuNotice("Kullanıcı adı veya şifre yanlış.");authBusy=false;sfx("deny");return;}
   await afterLogin(data.user.id);
  }catch(e){menuNotice("Bağlantı hatası.");authBusy=false;sfx("deny");}
 });
}
function doGuestLogin(){
 askText("MİSAFİR OLARAK OYNA — adını yaz",v=>{
  let n=v.trim().replace(/[^\p{L}\p{N} _-]/gu,"").slice(0,16);

/* ---------- GAME (unchanged) ---------- */

function drawPlayer(){
 if(!penguinFrames.length)return;
 const sk=skinImg();
 const penguin=sk||penguinFrames[Math.floor(t*0.18)%penguinFrames.length];
 if(!penguin.complete)return;

 if(sk&&hasFx(equipped)){
  const hh=p.h*costume(equipped).hf, bx=p.x+p.w/2, by=p.y+p.h;
  drawCostume(equipped,sk,bx,by+1,hh,t*16.7,!p.on,p.vy,1,p.on);
  return;
 }

 const phase = p.on ? Math.floor(t*0.18)%4 : 0;
 const runBob = p.on ? [0,-1.0,0.5,-0.7][phase] : 0;
 const runTilt = p.on ? [0,-0.012,0.009,0.014][phase] : 0;

 let sx=1, sy=1, tilt=runTilt;
 if(!p.on){
   const air=Math.max(-1,Math.min(1,p.vy/11.7));
   sy=1 + (-air)*0.03;
   sx=1 + (air)*0.02;
   tilt=Math.max(-0.03,Math.min(0.03,p.vy*0.0018));
 }

 const cx=p.x+p.w/2;
 const cy=p.y+p.h/2+runBob;
 x.save();
 x.translate(cx,cy);
 x.rotate(tilt);
 x.scale(sx,sy);
 if(sk){
   const sw=p.h*sk.naturalWidth/sk.naturalHeight;
   x.drawImage(sk,-sw/2,-p.h/2+runBob*1.8,sw,p.h);
 }else x.drawImage(penguin,-p.w/2,-p.h/2,p.w,p.h);
 x.restore();
}

function collision(a,b){
 return a.x+10<b.x+b.w-3 &&
        a.x+a.w-10>b.x+3 &&
        a.y+8<b.y+b.h &&
        a.y+a.h-5>b.y+4;
}

function ui(){
 x.textAlign="right";
 x.fillStyle=rgb(tod.hud);
 x.font="bold 17px monospace";
 x.fillText(String(Math.floor(score)).padStart(5,"0"),W-22,30);
 x.textAlign="left";
 drawCoin(26,24,9);
 x.fillStyle=rgb(tod.hud);x.font="bold 17px monospace";
 x.fillText(coinText(),41,30);
 x.textAlign="center";x.font="bold 13px Arial";if(bgTheme==="auto"||dimMode!=="none")x.fillText(dimMode!=="none"?DIMS[dimMode].icon+" "+DIMS[dimMode].name:tod.icon+" "+tod.name,W/2,22);
 drawDimBar();
 drawPowHud();
 if(phaseBanner&&(bgTheme==="auto"||dimMode!=="none")){
  const rem=phaseBanner.until-performance.now();
  if(rem>0){
   x.save();x.globalAlpha=Math.min(1,rem/600);x.textAlign="center";x.textBaseline="middle";
   x.font=`900 italic ${Math.max(22,Math.min(W*.075,34))}px "Arial Black",Arial,sans-serif`;
   x.lineWidth=5;x.lineJoin="round";x.strokeStyle="rgba(5,20,50,.7)";x.fillStyle="#fff";
   x.strokeText(phaseBanner.txt,W/2,H*.3);x.fillText(phaseBanner.txt,W/2,H*.3);
   x.restore();
  }
 }
 if(gToast&&performance.now()<gToast.until){
  x.save();
  const tw=Math.min(W*.86,380), tx0=W/2-tw/2;
  x.fillStyle="rgba(10,35,80,.94)";rr(tx0,84,tw,40,20);x.fill();
  x.lineWidth=2;x.strokeStyle="#ffe07a";rr(tx0,84,tw,40,20);x.stroke();
  x.fillStyle="#fff";x.textAlign="center";x.textBaseline="middle";
  x.font=`bold ${Math.max(13,Math.min(16,W*.04))}px Arial`;
  x.fillText("✅ "+gToast.txt,W/2,104,tw-24);
  x.restore();
 }
}

function update(dt){
 if(!playing||dead)return;
 t+=dt*60;
 score+=dt*4.2*(speedOn()?1.45:1);
 speed=Math.min(8.1,6+score/260)*(speedOn()?1.45:1)*((role==="owner")?cheatSpeedMult:1);
 qProgress("score",Math.floor(score),"max");

 spawn-=dt*60;
 portalLogic();
 powerTick();
 puLogic();
 if(spawn<=0){
   if(dimMode!=="none")dimSpawn();
   else if(Math.random()<PHASES[todPhase()].birds){addBird();spawn=80+Math.random()*40;}
   else{
     addObstacle();
     if(Math.random()<fishChance(.28))addFishAbove(obs[obs.length-1]);
     spawn=68+Math.random()*42-Math.min(score/35,15);
     if(spawn<52)spawn=52;
   }
 }

 const wasOn=p.on;
 p.vy+=.68;p.y+=p.vy;
 if(p.y+p.h>=ground){p.y=ground-p.h;p.vy=0;p.on=true;if(!wasOn&&dimMode==="ice")p.vx=(p.vx||0)+2.4;}
 if(dimMode==="ice")iceSlide();

 for(const o of obs)o.x-=(o.vx||speed);
 for(const f of fish)f.x-=speed;
 obs=obs.filter(o=>o.x+o.w>-20);
 for(const o of obs){
   if(!o.passed&&o.x+o.w<p.x&&o.kind!=="portal"){o.passed=true;coins++;runCoins++;lsSet("paralerCoins",coins);runObs++;qProgress("obstacles",1,"add");qProgress("run",runObs,"max");sfx("tick");achCheck();}
 }

 magnetPull();
 const pr={x:p.x+8,y:p.y+8,w:p.w-16,h:p.h-14};
 for(const f of fish){
   if(f.got)continue;
   if(pr.x<f.x+f.w&&pr.x+pr.w>f.x&&pr.y<f.y+f.h&&pr.y+pr.h>f.y){
     f.got=true;coins+=2;runCoins+=2;runFish++;lsSet("paralerCoins",coins);
     qProgress("fish",1,"add");addPop(f.x+14,f.y-6,"+2");sfx("fish");achCheck();
   }
 }
 fish=fish.filter(f=>!f.got&&f.x+f.w>-20);
 updatePowerups(pr);
 updatePops(dt);updateShards(dt);
 updateFallers(dt);
 {const ph=todPhase();if(ph!==lastPhase){lastPhase=ph;if(dimMode==="none"){sfx("chime");phaseBanner={txt:PHASES[ph].icon+" "+PHASES[ph].name,until:performance.now()+2400};}}}
 portalCheck(pr);
 dimStep();
 const shieldOn=!!pw&&pw.kind==="shield", sbox={x:p.x-12,y:p.y-10,w:p.w+24,h:p.h+16};
 for(const o of obs){
   if(o.kind==="portal"||o.dead)continue;
   if(role==="owner"&&cheatInvincible)continue;                     // yönetici ölümsüzlük
   if(shieldOn){if(collision(sbox,o))shieldHit(o);continue;}        // kalkan dokunduğu engeli yok eder
   if(shieldGrace>0)continue;                                      // kalkan bittikten sonra kısa süre koruma
   if(collision(p,o)){
     dead=true;sfx("die");
     best=Math.max(best,Math.floor(score));
     lsSet("penguinBest",best);
     break;
   }
 }
 if(obs.some(o=>o.dead))obs=obs.filter(o=>!o.dead);
}

let acc=0;
function loop(now){
 requestAnimationFrame(loop);
 if(now-last<(fpsMode===30?27:14))return;     // 30 FPS modunda her ikinci kare atlanır
 const dt=Math.min((now-last)/1000,.1)||0;last=now;
 if(screen==="boot") drawBoot(now);
 else if(screen==="auth") drawAuth(now);
 else if(screen==="menu"){drawMenu(now);if(!dailyAuto){dailyAuto=true;if(dailyClaimable())openDaily();}}
 else if(screen==="shop") drawShop(now);
 else if(screen==="leaderboard") drawLeaderboard(now);
 else if(screen==="panel") drawPanel(now);
 else if(screen==="cheats") drawCheats(now);
 else if(screen==="daily") drawDaily(now);
 else if(screen==="profile") drawProfile(now);
 else if(screen==="credits") drawCredits(now);
 else if(screen==="quests") drawQuests(now);
 else if(screen==="settings") drawSettings(now);
 else {
   acc+=dt;let steps=0;
   while(acc>=1/60-1e-4&&steps<6){update(1/60);acc-=1/60;steps++;}
   if(steps>=6)acc=0;
   drawScene();ui();
   if(dead){screen="gameover";}
   if(screen==="gameover"){
     x.save();
     x.fillStyle="rgba(3,20,48,.72)";x.fillRect(0,0,W,H);
     x.fillStyle="#fff";x.textAlign="center";x.textBaseline="alphabetic";
     x.font=`bold ${Math.max(24,Math.min(W*.07,48))}px Arial`;x.fillText("OYUN BİTTİ",W/2,H*.40);
     x.font=`bold ${Math.max(15,Math.min(W*.04,22))}px Arial`;
     x.fillText("Skor "+Math.floor(score)+"   Rekor "+best,W/2,H*.46);
     x.fillStyle="rgba(222,245,255,.85)";
     x.fillText("Bu oyunda +"+runCoins+" Coin"+(runFish?"   🐟 "+runFish:""),W/2,H*.50);
     x.fillText("Tekrar başlamak için dokun",W/2,H*.55);
     const m=gameoverMenuRect();
     x.fillStyle="rgba(86,217,255,.16)";rr(m.x,m.y,m.w,m.h,m.h/2);x.fill();
     x.lineWidth=2;x.strokeStyle="#56d9ff";rr(m.x,m.y,m.w,m.h,m.h/2);x.stroke();
     x.fillStyle="#fff";x.textBaseline="middle";x.fillText("Ana menü",W/2,m.y+m.h/2+1);
     x.restore();
   }
 }
}

requestAnimationFrame(loop);

 try{
  const g=lsGet("paralerGuestName");
  if(sb){
   const {data}=await sb.auth.getSession();
   if(data&&data.session){
    const ok=await afterLogin(data.session.user.id);
    if(ok)return;
   }
  }
  if(g){ isGuest=true;guestName=g;username=g;role="user";vip=false;screen="menu";return; }
 }catch(e){}
 screen="auth";
